theme: jekyll-theme-cayman
title: AI News Radar
description: Daily AI, developer, and research news curated by Horizon
baseurl: "/horizon-daily"
url: "https://elmerchong-del.github.io"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
